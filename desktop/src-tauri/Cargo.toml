[package]
name = "omnix-desktop"
version = "0.1.0"
description = "OMNI-X Windows desktop application"
authors = ["DigiSolUK"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.5.2", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-single-instance = "2.3.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.61.2", features = ["Win32_System_Diagnostics_ToolHelp", "Win32_Foundation"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
