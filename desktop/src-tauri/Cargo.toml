[package]
name = "omnix-desktop"
version = "0.1.0"
description = "OMNI-X Windows desktop application"
authors = ["DigiSolUK"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.4.1" }

[dependencies]
tauri = { version = "2.9.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
