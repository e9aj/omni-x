<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" role="img" aria-labelledby="title desc">
  <title id="title">OMNI-X animated mark</title>
  <desc id="desc">The OMNI-X mark with a subtle, reduced-motion-aware pulse.</desc>
  <style>
    .pulse { animation: pulse 3.2s ease-in-out infinite; transform-origin: 120px 120px; }
    .orbit { animation: orbit 8s linear infinite; transform-origin: 120px 120px; }
    @media (prefers-reduced-motion: reduce) {
      .pulse, .orbit { animation: none; }
    }
    @keyframes pulse { 0%, 100% { opacity: .78; transform: scale(1); } 50% { opacity: 1; transform: scale(1.035); } }
    @keyframes orbit { to { transform: rotate(360deg); } }
  </style>
  <rect width="800" height="240" rx="32" fill="#10151c"/>
  <g class="pulse">
    <rect x="34" y="34" width="172" height="172" rx="42" fill="#18222b" stroke="#8fe36a" stroke-width="5"/>
    <path d="M72 74l48 48 48-48M72 166l48-48 48 48" fill="none" stroke="#8fe36a" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="120" cy="120" r="8" fill="#f1f7ed"/>
  </g>
  <circle class="orbit" cx="120" cy="120" r="98" fill="none" stroke="#8fe36a" stroke-opacity=".24" stroke-width="2" stroke-dasharray="4 18"/>
  <text x="250" y="143" fill="#f1f7ed" font-family="Segoe UI, Arial, sans-serif" font-size="72" font-weight="700" letter-spacing="8">OMNI-X</text>
</svg>
