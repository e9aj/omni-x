name: Windows Desktop

on:
  pull_request:
    branches: [main]
    paths:
      - "desktop/**"
      - "src/omnix/**"
      - ".github/workflows/desktop.yml"
  push:
    branches: [feat/windows-desktop, codex/alpha-candidate, codex/critical-overhaul]

permissions:
  contents: read

jobs:
  tauri-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Validate frontend
        working-directory: desktop
        run: |
          npm run typecheck
          npm run build
      - name: Build managed Python backend sidecar
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m pip install .
          New-Item -ItemType Directory -Force desktop/src-tauri/binaries | Out-Null
          pyinstaller --clean --noconfirm --onefile --name omnix-backend --paths src src/omnix_backend_entry.py
          Copy-Item dist/omnix-backend.exe desktop/src-tauri/binaries/omnix-backend.exe -Force
          Copy-Item dist/omnix-backend.exe desktop/src-tauri/binaries/omnix-backend-x86_64-pc-windows-msvc.exe -Force
      - name: Generate OMNI-X application icons
        working-directory: desktop
        run: npm run tauri -- icon src/assets/website-logo.png
      - name: Build Windows NSIS installer
        working-directory: desktop
        run: npm run tauri build
      - name: Smoke install and launch on hosted Windows runner
        shell: pwsh
        timeout-minutes: 15
        run: |
          $env:OMNIX_DATA_DIR = Join-Path $env:RUNNER_TEMP 'omnix-smoke-data'
          $env:OMNIX_VAULT_DIR = Join-Path $env:RUNNER_TEMP 'omnix-smoke-vault'
          $installer = Get-ChildItem desktop/src-tauri/target/release/bundle/nsis -Filter '*.exe' | Select-Object -First 1
          Write-Host "Installer: $($installer.FullName)"
          if (-not $installer) { throw 'NSIS installer was not produced' }
          Write-Host "Installer SHA-256: $((Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash)"
          Write-Host "Installer signature status: $((Get-AuthenticodeSignature -LiteralPath $installer.FullName).Status)"
          $install = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait -PassThru
          Write-Host "Installer exit code: $($install.ExitCode)"
          if ($install.ExitCode -ne 0) { throw "NSIS installer failed with exit code $($install.ExitCode)" }
          $app = Get-ChildItem "$env:LOCALAPPDATA" -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.Name -in @('omnix-desktop.exe', 'OMNI-X.exe') } | Select-Object -First 1
          Write-Host "Application candidate: $($app.FullName)"
          if (-not $app) { Write-Host 'Installed files under LOCALAPPDATA:'; Get-ChildItem "$env:LOCALAPPDATA" -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 200 FullName; throw 'Installed OMNI-X executable was not found' }
          Write-Host "Installation directory: $(Split-Path $app.FullName)"
          Write-Host 'Installed OMNI-X files:'
          Get-ChildItem (Split-Path $app.FullName) -File | Select-Object Name,Length | Format-Table -AutoSize
          $installDir = Split-Path $app.FullName
          $probe = Join-Path $installDir 'omnix-backend.exe'
          if (-not (Test-Path -LiteralPath $probe)) { throw "Packaged backend not found at $probe" }
          $probeToken = 'smoke-probe-' + [guid]::NewGuid().ToString('N')
          $probeOut = Join-Path $env:TEMP 'omnix-backend-probe.stdout.log'
          $probeErr = Join-Path $env:TEMP 'omnix-backend-probe.stderr.log'
          Remove-Item -LiteralPath $probeOut,$probeErr -Force -ErrorAction SilentlyContinue
          $probeProcess = Start-Process -FilePath $probe -ArgumentList '--port','27452' -WorkingDirectory $installDir -Environment @{ OMNIX_IPC_TOKEN = $probeToken } -RedirectStandardOutput $probeOut -RedirectStandardError $probeErr -PassThru
          Start-Sleep -Seconds 3
          if ($probeProcess.HasExited) {
            $probeProcess.Refresh()
            Write-Host "Packaged backend probe exit code: $($probeProcess.ExitCode)"
            Write-Host 'Packaged backend probe stderr:'; if (Test-Path $probeErr) { Get-Content $probeErr -Tail 100 }
            Write-Host 'Packaged backend probe stdout:'; if (Test-Path $probeOut) { Get-Content $probeOut -Tail 100 }
            throw 'Packaged backend exited before smoke probe'
          }
          $health = Invoke-RestMethod -Uri 'http://127.0.0.1:27452/v1/health' -Headers @{ Authorization = "Bearer $probeToken"; Origin = 'tauri://localhost' } -TimeoutSec 5
          if ($health.status -ne 'ok') { throw 'Packaged backend health probe did not return status ok' }
          Write-Host 'Packaged backend direct probe: passed'
          try { Invoke-RestMethod -Method Post -Uri 'http://127.0.0.1:27452/v1/shutdown' -Headers @{ Authorization = "Bearer $probeToken"; Origin = 'tauri://localhost' } -TimeoutSec 5 | Out-Null } catch { }
          for ($attempt = 0; $attempt -lt 20; $attempt++) {
            if (-not (Get-Process -Id $probeProcess.Id -ErrorAction SilentlyContinue)) { break }
            Start-Sleep -Milliseconds 250
          }
          if (Get-Process -Id $probeProcess.Id -ErrorAction SilentlyContinue) { Stop-Process -Id $probeProcess.Id -Force; Wait-Process -Id $probeProcess.Id -Timeout 10 -ErrorAction SilentlyContinue }
          $appToken = 'smoke-app-' + [guid]::NewGuid().ToString('N')
          $stderr = Join-Path $env:TEMP 'omnix-desktop-stderr.log'
          $stdout = Join-Path $env:TEMP 'omnix-desktop-stdout.log'
          $supervisorLog = Join-Path $env:TEMP 'omnix-desktop-supervisor.log'
          Remove-Item -LiteralPath $supervisorLog -Force -ErrorAction SilentlyContinue
          $previousAppToken = $env:OMNIX_IPC_TOKEN
          $env:OMNIX_IPC_TOKEN = $appToken
          $launchTimer = [System.Diagnostics.Stopwatch]::StartNew()
          try { $desktop = Start-Process -FilePath $app.FullName -PassThru -RedirectStandardError $stderr -RedirectStandardOutput $stdout } finally { if ($null -eq $previousAppToken) { Remove-Item Env:OMNIX_IPC_TOKEN -ErrorAction SilentlyContinue } else { $env:OMNIX_IPC_TOKEN = $previousAppToken } }
          $windowMs = $null
          for ($attempt = 0; $attempt -lt 120; $attempt++) {
            $desktop.Refresh()
            if ($desktop.MainWindowHandle -ne [IntPtr]::Zero) { $windowMs = $launchTimer.ElapsedMilliseconds; break }
            if ($desktop.HasExited) { break }
            Start-Sleep -Milliseconds 100
          }
          Write-Host "First window handle (ms): $windowMs (does not measure interactivity)"
          Write-Host "Application PID: $($desktop.Id), exited: $($desktop.HasExited)"
          if ($desktop.HasExited) { throw "OMNI-X exited during startup with code $($desktop.ExitCode)" }
          Write-Host 'Application child processes:'
          Get-CimInstance Win32_Process | Where-Object { $_.ParentProcessId -eq $desktop.Id } | Select-Object Name,ProcessId,ParentProcessId,ExecutablePath | Format-Table -AutoSize
          $ownedBackend = $null
          $readyHealth = $null
          $base = 'http://127.0.0.1:27451'
          $headers = @{ Authorization = "Bearer $appToken"; Origin = 'tauri://localhost' }
          for ($attempt = 0; $attempt -lt 60; $attempt++) {
            $ownedBackend = @(Get-CimInstance Win32_Process | Where-Object { $_.Name -eq 'omnix-backend.exe' -and $_.ParentProcessId -eq $desktop.Id })
            if ($ownedBackend) {
              try {
                $candidateHealth = Invoke-RestMethod -Uri "$base/v1/health" -Headers $headers -TimeoutSec 2
                if ($candidateHealth.status -eq 'ok' -and $candidateHealth.pid) { $readyHealth = $candidateHealth; break }
              } catch { }
            }
            if ($desktop.HasExited) { break }
            Start-Sleep -Milliseconds 500
          }
          Write-Host "Desktop-owned backend processes: $(@($ownedBackend).Count)"
          if (-not $ownedBackend -or -not $readyHealth) { Write-Host 'OMNI-X stderr:'; if (Test-Path $stderr) { Get-Content $stderr -Tail 100 }; Write-Host 'OMNI-X stdout:'; if (Test-Path $stdout) { Get-Content $stdout -Tail 100 }; Write-Host 'Supervisor log:'; if (Test-Path $supervisorLog) { Get-Content $supervisorLog -Tail 100 }; throw 'Desktop-owned backend did not reach authenticated readiness' }
          Write-Host "Backend authenticated readiness observed (ms): $($launchTimer.ElapsedMilliseconds) (includes window and polling overhead)"
          $frontendMarker = $null
          for ($attempt = 0; $attempt -lt 100; $attempt++) {
            if (Test-Path $supervisorLog) { $frontendMarker = Select-String -Path $supervisorLog -SimpleMatch 'frontend animation frame elapsed_ms=' | Select-Object -First 1 }
            if ($frontendMarker -or $desktop.HasExited) { break }
            Start-Sleep -Milliseconds 100
          }
          if ($frontendMarker) { Write-Host "Frontend frame marker: $($frontendMarker.Line) (does not measure input responsiveness)" } else { Write-Host 'Frontend frame marker unavailable' }
          if (Test-Path $supervisorLog) { Select-String -Path $supervisorLog -Pattern 'spawned backend pid=|health passed launcher_pid=' | ForEach-Object { Write-Host "Startup marker: $($_.Line)" } }
          $valuePattern = $null
          $automationStage = 'load'
          try {
            Add-Type -AssemblyName UIAutomationClient
            $automationStage = 'window'
            $windowElement = [System.Windows.Automation.AutomationElement]::FromHandle($desktop.MainWindowHandle)
            $automationStage = 'find-input'
            $condition = [System.Windows.Automation.PropertyCondition]::new([System.Windows.Automation.AutomationElement]::NameProperty, 'Message OMNI-X')
            $inputElement = $windowElement.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $condition)
            if (-not $inputElement -or -not $inputElement.Current.IsEnabled) { throw 'Accessible chat input unavailable' }
            $automationStage = 'value-pattern'
            $valuePattern = $inputElement.GetCurrentPattern([System.Windows.Automation.ValuePattern]::Pattern)
            $automationStage = 'value-round-trip'
            $inputTimer = [System.Diagnostics.Stopwatch]::StartNew()
            $valuePattern.SetValue('local interaction probe')
            if ($valuePattern.Current.Value -ne 'local interaction probe') { throw 'Input value did not round-trip' }
            $inputTimer.Stop()
            Write-Host "Chat input UI Automation value round-trip (ms): $($inputTimer.ElapsedMilliseconds) (after readiness; not cold startup or physical typing)"
          } catch { Write-Host "Chat input UI Automation measurement unavailable at $automationStage ($($_.Exception.GetType().Name))" } finally { if ($valuePattern) { try { $valuePattern.SetValue('') } catch { } } }
          $desktop.Refresh()
          $cpuStart = $desktop.TotalProcessorTime.TotalSeconds
          Start-Sleep -Seconds 2
          $desktop.Refresh()
          $cpuDelta = $desktop.TotalProcessorTime.TotalSeconds - $cpuStart
          Write-Host "Desktop process idle sample: CPU seconds over 2s=$cpuDelta; private bytes=$($desktop.PrivateMemorySize64) (excludes WebView and backend processes)"
          function Get-OwnedResourceSample([int]$rootId) {
            $processes = @(Get-CimInstance Win32_Process)
            $ids = [System.Collections.Generic.HashSet[int]]::new()
            [void]$ids.Add($rootId)
            do {
              $changed = $false
              foreach ($process in $processes) {
                if ($ids.Contains([int]$process.ParentProcessId) -and $ids.Add([int]$process.ProcessId)) { $changed = $true }
              }
            } while ($changed)
            $samples = @{}
            foreach ($id in $ids) {
              $process = Get-Process -Id $id -ErrorAction SilentlyContinue
              if ($process) { try { $samples[$id] = @{ cpu = $process.TotalProcessorTime.TotalSeconds; memory = $process.PrivateMemorySize64; started = $process.StartTime.ToUniversalTime().Ticks } } catch { } }
            }
            return $samples
          }
          $treeStart = Get-OwnedResourceSample $desktop.Id
          Start-Sleep -Seconds 2
          $treeEnd = Get-OwnedResourceSample $desktop.Id
          $treeCpu = 0.0; $treeMemory = 0
          foreach ($id in $treeEnd.Keys) {
            $treeMemory += $treeEnd[$id].memory
            if ($treeStart.ContainsKey($id) -and $treeStart[$id].started -eq $treeEnd[$id].started) { $treeCpu += [Math]::Max(0, $treeEnd[$id].cpu - $treeStart[$id].cpu) }
          }
          Write-Host "Desktop process-tree idle sample: processes=$($treeEnd.Count); CPU seconds over at least 2s=$treeCpu; private bytes=$treeMemory (snapshot; excludes processes outside the tree and CPU of newly started/exited children)"
          Add-Type -AssemblyName System.Drawing
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class OmnixWindowCapture {
            [StructLayout(LayoutKind.Sequential)] public struct Rect { public int Left, Top, Right, Bottom; }
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr hwnd, out Rect rect);
            [DllImport("user32.dll")] public static extern bool PrintWindow(IntPtr hwnd, IntPtr hdc, uint flags);
          }
          '@
          $desktop.Refresh()
          $captureRect = New-Object OmnixWindowCapture+Rect
          if ($desktop.MainWindowHandle -ne [IntPtr]::Zero -and [OmnixWindowCapture]::GetWindowRect($desktop.MainWindowHandle, [ref]$captureRect)) {
            $captureWidth = $captureRect.Right - $captureRect.Left
            $captureHeight = $captureRect.Bottom - $captureRect.Top
            if ($captureWidth -gt 0 -and $captureHeight -gt 0 -and $captureWidth -le 8192 -and $captureHeight -le 8192) {
              $bitmap = [System.Drawing.Bitmap]::new($captureWidth, $captureHeight)
              $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
              $hdc = $graphics.GetHdc()
              try { $captured = [OmnixWindowCapture]::PrintWindow($desktop.MainWindowHandle, $hdc, 2) } finally { $graphics.ReleaseHdc($hdc); $graphics.Dispose() }
              if ($captured) { $bitmap.Save((Join-Path $env:RUNNER_TEMP 'omnix-window.png'), [System.Drawing.Imaging.ImageFormat]::Png); Write-Host 'Window capture saved for visual review' }
              $bitmap.Dispose()
            }
          }
          $ownedBackendIds = @($ownedBackend | ForEach-Object { [int]$_.ProcessId })
          function Test-ProcessDescendant([int]$processId, [int]$ancestorId) {
            if ($processId -eq $ancestorId) { return $true }
            $current = $processId
            for ($depth = 0; $depth -lt 32; $depth++) {
              $process = Get-CimInstance Win32_Process -Filter "ProcessId = $current" -ErrorAction SilentlyContinue
              if (-not $process) { return $false }
              $parent = [int]$process.ParentProcessId
              if ($parent -eq $ancestorId) { return $true }
              if ($parent -eq 0 -or $parent -eq $current) { return $false }
              $current = $parent
            }
            return $false
          }
          try { Invoke-WebRequest -Uri "$base/v1/health" -UseBasicParsing -TimeoutSec 5 -ErrorAction Stop | Out-Null; throw 'Unauthenticated health request was accepted' } catch { if (-not $_.Exception.Response -or [int]$_.Exception.Response.StatusCode -ne 401) { throw } }
          $settings = Invoke-RestMethod -Uri "$base/v1/settings" -Headers $headers -TimeoutSec 5
          if ($settings.mode -ne 'FREE' -or $settings.allow_paid -ne $false) { throw "FREE mode enforcement failed: mode=$($settings.mode) allow_paid=$($settings.allow_paid)" }
          Write-Host "Desktop model policy: provider=$($settings.provider) model=$($settings.model) mode=$($settings.mode) allow_paid=$($settings.allow_paid)"
          foreach ($preference in @('standard','creative','open')) {
            Invoke-RestMethod -Method Post -Uri "$base/v1/settings" -Headers $headers -ContentType 'application/json' -Body (@{ content_preference = $preference } | ConvertTo-Json) -TimeoutSec 5 | Out-Null
            $saved = Invoke-RestMethod -Uri "$base/v1/settings" -Headers $headers -TimeoutSec 5
            if ($saved.content_preference -ne $preference) { throw "Content preference did not persist: $preference" }
          }
          $approvalId = [guid]::NewGuid().ToString()
          try { Invoke-RestMethod -Method Post -Uri "$base/v1/approvals/$approvalId" -Headers $headers -ContentType 'application/json' -Body '{"decision":"reject"}' -TimeoutSec 5 | Out-Null; throw 'Unknown approval was accepted' } catch { if (-not $_.Exception.Response -or [int]$_.Exception.Response.StatusCode -ne 404) { throw } }
          $stop = Invoke-RestMethod -Method Post -Uri "$base/v1/stop" -Headers $headers -ContentType 'application/json' -Body '{}' -TimeoutSec 5
          Write-Host "Stop endpoint response: stopping=$($stop.stopping)"
          $noteBody = @{ path = 'smoke/note.md'; content = 'OMNI-X isolated smoke note' } | ConvertTo-Json
          Invoke-RestMethod -Method Post -Uri "$base/v1/brain/notes" -Headers $headers -ContentType 'application/json' -Body $noteBody -TimeoutSec 10 | Out-Null
          $note = Invoke-RestMethod -Uri "$base/v1/brain/note?path=smoke%2Fnote.md" -Headers $headers -TimeoutSec 10
          if ($note.content -ne 'OMNI-X isolated smoke note') { throw 'Brain note readback failed' }
          $workflowBody = @{ name = 'Smoke approval'; definition = @{ nodes = @(@{ id = 'confirm'; action = 'approval' }) } } | ConvertTo-Json -Depth 8
          $workflow = Invoke-RestMethod -Method Post -Uri "$base/v1/workflows" -Headers $headers -ContentType 'application/json' -Body $workflowBody -TimeoutSec 10
          $workflowRun = Invoke-RestMethod -Method Post -Uri "$base/v1/workflows/$($workflow.workflow_id)/run" -Headers $headers -ContentType 'application/json' -Body '{}' -TimeoutSec 10
          $pendingApproval = $false
          for ($attempt = 0; $attempt -lt 50; $attempt++) {
            $approvalList = Invoke-RestMethod -Uri "$base/v1/approvals" -Headers $headers -TimeoutSec 5
            if (@($approvalList.approvals).Count -gt 0) { $pendingApproval = $true; break }
            Start-Sleep -Milliseconds 100
          }
          if (-not $pendingApproval) { throw 'Workflow approval was not requested' }
          Invoke-RestMethod -Method Post -Uri "$base/v1/workflow-runs/$($workflowRun.run_id)/cancel" -Headers $headers -ContentType 'application/json' -Body '{}' -TimeoutSec 5 | Out-Null
          $approvalCleared = $false
          for ($attempt = 0; $attempt -lt 50; $attempt++) {
            $approvalList = Invoke-RestMethod -Uri "$base/v1/approvals" -Headers $headers -TimeoutSec 5
            if (@($approvalList.approvals).Count -eq 0) { $approvalCleared = $true; break }
            Start-Sleep -Milliseconds 100
          }
          if (-not $approvalCleared) { throw 'Cancelled workflow approval remained pending' }
          Write-Host 'Brain note readback and workflow approval cancellation passed'
          # Exercise concurrent reads while the scheduler owns the same SQLite store.
          $readJobs = @()
          try {
            for ($worker = 0; $worker -lt 4; $worker++) {
              $readJobs += Start-Job -ArgumentList $base,$appToken -ScriptBlock {
                param($endpoint, $token)
                $requestHeaders = @{ Authorization = "Bearer $token"; Origin = 'tauri://localhost' }
                for ($i = 0; $i -lt 25; $i++) {
                  $result = Invoke-RestMethod -Uri "$endpoint/v1/tasks" -Headers $requestHeaders -TimeoutSec 10 -ErrorAction Stop
                  if ($null -eq $result.tasks) { throw 'Task list missing from response' }
                }
              }
            }
            if (-not (Wait-Job -Job $readJobs -Timeout 90)) { throw 'Concurrent task reads timed out' }
            foreach ($job in $readJobs) {
              if ($job.State -ne 'Completed') { Receive-Job -Job $job -ErrorAction Stop; throw 'Concurrent task read failed' }
              Receive-Job -Job $job -ErrorAction Stop | Out-Null
            }
          } finally {
            foreach ($job in $readJobs) { if ($job.State -eq 'Running') { Stop-Job -Job $job }; Remove-Job -Job $job -Force }
          }
          Write-Host 'Concurrent packaged task reads passed'
          $oldBackendPid = $ownedBackendIds[0]
          $oldHealth = $readyHealth
          if (-not (Test-ProcessDescendant ([int]$oldHealth.pid) $oldBackendPid)) { throw "Authenticated backend PID $($oldHealth.pid) is not owned by launcher $oldBackendPid" }
          $killResult = & taskkill.exe /PID $oldBackendPid /T /F 2>&1
          if ($LASTEXITCODE -ne 0) { Write-Host $killResult; throw "Failed to terminate owned backend process tree $oldBackendPid" }
          $restarted = $null
          $healthAfterRestart = $null
          for ($attempt = 0; $attempt -lt 90; $attempt++) {
            Start-Sleep -Milliseconds 500
            $candidate = Get-CimInstance Win32_Process | Where-Object { $_.Name -eq 'omnix-backend.exe' -and $_.ParentProcessId -eq $desktop.Id }
            $replacement = @($candidate | Where-Object { [int]$_.ProcessId -ne $oldBackendPid })[0]
            if ($replacement) {
              try {
                $candidateHealth = Invoke-RestMethod -Uri "$base/v1/health" -Headers $headers -TimeoutSec 2
                if ($candidateHealth.status -eq 'ok' -and (Test-ProcessDescendant ([int]$candidateHealth.pid) ([int]$replacement.ProcessId))) { $restarted = $replacement; $healthAfterRestart = $candidateHealth; break }
              } catch { }
            }
          }
          if (-not $restarted) { Write-Host 'Supervisor log after recovery failure:'; if (Test-Path $supervisorLog) { Get-Content $supervisorLog -Tail 100 }; throw 'Desktop did not restart its owned backend after a controlled crash' }
          $ownedBackendIds += [int]$restarted.ProcessId
          Write-Host "Backend crash recovery passed: old_launcher=$oldBackendPid old_backend=$($oldHealth.pid) new_launcher=$($restarted.ProcessId) new_backend=$($healthAfterRestart.pid)"
          $gatewayAvailable = $false
          try { $models = Invoke-RestMethod -Uri 'http://127.0.0.1:20128/v1/models' -TimeoutSec 3; $gatewayAvailable = $true } catch { Write-Host 'Live OmniRoute route unavailable on hosted runner; live desktop inference skipped' }
          if ($gatewayAvailable) {
            try {
              $live = Invoke-RestMethod -Method Post -Uri "$base/v1/chat" -Headers $headers -ContentType 'application/json' -Body (@{ prompt = 'Reply with exactly LIVE-DESKTOP-OK.' } | ConvertTo-Json) -TimeoutSec 90
              if ([string]::IsNullOrWhiteSpace($live.answer) -or [string]::IsNullOrWhiteSpace($live.model)) { throw 'Live desktop response lacked answer or actual model' }
              Write-Host "Live desktop inference passed: provider=$($live.provider) model=$($live.model) usage_count=$(@($live.usage).Count) session=$($live.session_id)"
              $liveSession = $live.session_id
            } catch { Write-Host "Live OmniRoute desktop inference failed without credentials/route: $($_.Exception.Message)" }
          } else {
            try {
              Invoke-RestMethod -Method Post -Uri "$base/v1/chat" -Headers $headers -ContentType 'application/json' -Body (@{ prompt = 'Local no-provider failure test'; stream_id = 'offline-smoke' } | ConvertTo-Json) -TimeoutSec 30 | Out-Null
              throw 'No-provider chat unexpectedly succeeded'
            } catch {
              if (-not $_.Exception.Response -or [int]$_.Exception.Response.StatusCode -ne 502) { throw }
            }
            $healthAfterFailure = Invoke-RestMethod -Uri "$base/v1/health" -Headers $headers -TimeoutSec 5
            if ($healthAfterFailure.status -ne 'ok') { throw 'Backend did not remain responsive after no-provider chat' }
            Write-Host 'No-provider chat failure and subsequent backend health passed'
          }
          $fixture = Start-Process -FilePath (Get-Command python).Source -ArgumentList '-u','scripts/fixture_stream_provider.py','--port','27464' -WindowStyle Hidden -PassThru
          $streamJob = $null
          try {
            $fixtureReady = $false
            for ($attempt = 0; $attempt -lt 40; $attempt++) {
              if ($fixture.HasExited) { break }
              $probeSocket = [System.Net.Sockets.TcpClient]::new()
              try { $probeSocket.Connect('127.0.0.1', 27464); $fixtureReady = $true; break } catch { Start-Sleep -Milliseconds 100 } finally { $probeSocket.Dispose() }
            }
            if (-not $fixtureReady) { throw 'Loopback stream fixture did not start' }
            $configPath = Join-Path $env:OMNIX_DATA_DIR 'config.json'
            $config = Get-Content -LiteralPath $configPath -Raw | ConvertFrom-Json
            $config.provider = 'omniroute'; $config.model = 'fixture-free'; $config.base_url = 'http://127.0.0.1:27464/v1'; $config.mode = 'FREE'; $config.allow_paid = $false; $config.free_models = @('fixture-free')
            $config | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath $configPath -Encoding utf8
            $streamJob = Start-Job -ArgumentList $base,$appToken -ScriptBlock {
              param($endpoint, $token)
              $jobHeaders = @{ Authorization = "Bearer $token"; Origin = 'tauri://localhost' }
              $body = @{ prompt = 'Return the fixture response'; stream_id = 'fixture-smoke' } | ConvertTo-Json
              Invoke-RestMethod -Method Post -Uri "$endpoint/v1/chat" -Headers $jobHeaders -ContentType 'application/json' -Body $body -TimeoutSec 30
            }
            $partialSeen = $false
            for ($attempt = 0; $attempt -lt 150; $attempt++) {
              $partial = Invoke-RestMethod -Uri "$base/v1/chat/stream?id=fixture-smoke" -Headers $headers -TimeoutSec 5
              if ($partial.text -eq 'fixture ') { $partialSeen = $true; break }
              if ($streamJob.State -in @('Completed', 'Failed', 'Stopped')) { break }
              Start-Sleep -Milliseconds 100
            }
            if (-not $partialSeen) { throw 'Packaged chat did not expose incremental fixture output' }
            if (-not (Wait-Job -Job $streamJob -Timeout 30)) { throw 'Packaged streaming chat timed out' }
            $streamResult = Receive-Job -Job $streamJob -ErrorAction Stop
            if ($streamResult.answer -ne 'fixture response' -or -not $streamResult.session_id) { throw 'Packaged streaming chat returned an invalid result' }
            $liveSession = $streamResult.session_id
            Write-Host 'Packaged loopback streaming and final response passed'
          } finally {
            if ($streamJob) { if ($streamJob.State -eq 'Running') { Stop-Job -Job $streamJob }; Remove-Job -Job $streamJob -Force }
            if (-not $fixture.HasExited) { Stop-Process -Id $fixture.Id -Force; Wait-Process -Id $fixture.Id -Timeout 10 -ErrorAction SilentlyContinue }
          }
          $desktop.CloseMainWindow() | Out-Null
          if (-not $desktop.WaitForExit(15000)) { $desktop.Kill(); throw 'OMNI-X did not shut down gracefully' }
          Write-Host "Application shutdown exit code: $($desktop.ExitCode)"
          Start-Sleep -Seconds 2
          $remainingOwned = @($ownedBackendIds | Where-Object { Get-Process -Id $_ -ErrorAction SilentlyContinue })
          if ($remainingOwned.Count -gt 0) { throw "Desktop-owned backend sidecar remained after application shutdown: $($remainingOwned -join ',')" }
          $previousAppToken = $env:OMNIX_IPC_TOKEN
          $env:OMNIX_IPC_TOKEN = $appToken
          try { $desktop = Start-Process -FilePath $app.FullName -PassThru } finally { if ($null -eq $previousAppToken) { Remove-Item Env:OMNIX_IPC_TOKEN -ErrorAction SilentlyContinue } else { $env:OMNIX_IPC_TOKEN = $previousAppToken } }
          $relaunchReady = $false
          $ownedAgain = $null
          for ($attempt = 0; $attempt -lt 90; $attempt++) {
            if ($desktop.HasExited) { break }
            $ownedAgain = @(Get-CimInstance Win32_Process | Where-Object { $_.Name -eq 'omnix-backend.exe' -and $_.ParentProcessId -eq $desktop.Id })
            if ($ownedAgain) {
              try {
                $relaunchHealth = Invoke-RestMethod -Uri "$base/v1/health" -Headers $headers -TimeoutSec 2
                if ($relaunchHealth.status -eq 'ok' -and (Test-ProcessDescendant ([int]$relaunchHealth.pid) ([int]$ownedAgain[0].ProcessId))) { $relaunchReady = $true; break }
              } catch { }
            }
            Start-Sleep -Milliseconds 500
          }
          if (-not $relaunchReady) { throw 'OMNI-X failed to relaunch with an authenticated owned backend' }
          Write-Host 'Relaunch and authenticated readiness passed without requiring live inference'
          $warmMarkers = @(Select-String -Path $supervisorLog -SimpleMatch 'frontend animation frame elapsed_ms=')
          if ($warmMarkers.Count -ge 2) { Write-Host "Warm frontend frame marker: $($warmMarkers[-1].Line) (does not measure input responsiveness)" } else { Write-Host 'Warm frontend frame marker unavailable' }
          $persistedNote = Invoke-RestMethod -Uri "$base/v1/brain/note?path=smoke%2Fnote.md" -Headers $headers -TimeoutSec 10
          if ($persistedNote.content -ne 'OMNI-X isolated smoke note') { throw 'Brain note did not persist across relaunch' }
          $persistedWorkflows = Invoke-RestMethod -Uri "$base/v1/workflows" -Headers $headers -TimeoutSec 10
          if (-not @($persistedWorkflows.workflows | Where-Object { $_.id -eq $workflow.workflow_id })) { throw 'Workflow did not persist across relaunch' }
          Write-Host 'Brain note and workflow definition persisted across relaunch'
          if ($liveSession) {
            $persisted = Invoke-RestMethod -Uri "$base/v1/sessions/$liveSession" -Headers $headers -TimeoutSec 5
            if (@($persisted.messages).Count -lt 2) { throw 'Live conversation was not persisted in SQLite after desktop restart' }
            Write-Host "SQLite conversation persistence passed: session=$liveSession messages=$(@($persisted.messages).Count)"
          }
          $relaunchIds = @($ownedAgain | ForEach-Object { [int]$_.ProcessId })
          $desktop.CloseMainWindow() | Out-Null
          if (-not $desktop.WaitForExit(15000)) { $desktop.Kill(); throw 'OMNI-X did not shut down after relaunch' }
          Start-Sleep -Seconds 2
          if (@($relaunchIds | Where-Object { Get-Process -Id $_ -ErrorAction SilentlyContinue }).Count -gt 0) { throw 'Owned backend remained after relaunch shutdown' }
          # Close as soon as a native window appears, without waiting for backend readiness.
          $existingBackendIds = @(Get-CimInstance Win32_Process -Filter "Name = 'omnix-backend.exe'" | ForEach-Object { [int]$_.ProcessId })
          $previousAppToken = $env:OMNIX_IPC_TOKEN
          $env:OMNIX_IPC_TOKEN = $appToken
          try { $earlyDesktop = Start-Process -FilePath $app.FullName -PassThru } finally { if ($null -eq $previousAppToken) { Remove-Item Env:OMNIX_IPC_TOKEN -ErrorAction SilentlyContinue } else { $env:OMNIX_IPC_TOKEN = $previousAppToken } }
          $earlyWindow = $false
          for ($attempt = 0; $attempt -lt 100; $attempt++) {
            $earlyDesktop.Refresh()
            if ($earlyDesktop.HasExited) { break }
            if ($earlyDesktop.MainWindowHandle -ne 0) { $earlyWindow = $true; break }
            Start-Sleep -Milliseconds 100
          }
          if (-not $earlyWindow) { throw 'Rapid-close test could not find the application window' }
          $earlyDesktop.CloseMainWindow() | Out-Null
          if (-not $earlyDesktop.WaitForExit(20000)) { $earlyDesktop.Kill(); throw 'Rapid-close desktop did not exit' }
          Start-Sleep -Seconds 5
          $unexpectedBackend = @(Get-CimInstance Win32_Process -Filter "Name = 'omnix-backend.exe'" | Where-Object { [int]$_.ProcessId -notin $existingBackendIds })
          if ($unexpectedBackend.Count -gt 0) { throw 'New backend process remained after rapid close' }
          $socket = [System.Net.Sockets.TcpClient]::new()
          try {
            $connect = $socket.BeginConnect('127.0.0.1', 27451, $null, $null)
            if ($connect.AsyncWaitHandle.WaitOne(1000) -and $socket.Connected) { throw 'Backend port remained open after rapid close' }
          } finally { $socket.Dispose() }
          Write-Host 'Rapid-close backend cleanup passed'
          $uninstaller = Get-ChildItem (Split-Path $app.FullName) -Filter 'uninstall*.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($uninstaller) { $removed = Start-Process -FilePath $uninstaller.FullName -ArgumentList '/S' -Wait -PassThru; if ($removed.ExitCode -ne 0) { throw "Uninstaller failed with exit code $($removed.ExitCode)" } }
      - name: Upload Windows development installer
        uses: actions/upload-artifact@v4
        with:
          name: omnix-windows-installer-${{ github.sha }}
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Upload Windows window capture
        uses: actions/upload-artifact@v4
        with:
          name: omnix-window-capture-${{ github.sha }}
          path: ${{ runner.temp }}/omnix-window.png
          if-no-files-found: warn
